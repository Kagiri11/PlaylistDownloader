; =====================================================================
;  DJ Music Sorter - configuration
;  Fill in the three API values under [api]. Everything else has sane
;  defaults you can tweak. Lines starting with ; are comments.
; =====================================================================

[paths]
; Files here are moved into sort_dir FIRST on every run (subfolders too -
; the playlist downloader nests one folder per playlist).
intake_dir = /home/you/Music
; The inbox that gets sorted (ends up empty after a run).
sort_dir   = /media/you/DRIVE/To Sort
; Where the genre folders live - siblings of "To Sort", at the drive root.
library_dir = /media/you/DRIVE
; ffprobe (from the system ffmpeg: sudo apt install ffmpeg).
ffprobe    = /usr/bin/ffprobe

[api]
; --- Spotify (free): https://developer.spotify.com/dashboard ---
;   Create an app -> copy Client ID and Client secret here.
spotify_client_id     =
spotify_client_secret =

; --- Last.fm (free): https://www.last.fm/api/account/create ---
;   Create an API account -> copy the "API key" here.
lastfm_api_key =

; --- MusicBrainz needs NO key, just an identifying User-Agent. ---
;   Put a real contact so MusicBrainz doesn't rate-limit you.
musicbrainz_user_agent = DJMusicSorter/1.0 ( you@example.com )

[settings]
; A song needs at least this many agreeing signals to be auto-filed;
; below this it goes to the _Review folder instead.
confidence_threshold = 2
; Also process video files (.mp4 etc.), not just audio.
include_video = true
; Two tracks count as the same song only if their lengths are within this many
; seconds (so radio edits / extended mixes / remixes are kept as separate songs).
duplicate_tolerance_seconds = 10

[rosters]
; Use the per-folder _artists.txt lists to correct placement by artist.
enabled = true
; How many artists to pull from each Last.fm genre chart.
tag_top_artists = 40
; How many related/similar artists to add per known artist during --update-rosters.
related_per_artist = 10
